name: Bug report
description: Something in PathDeck doesn't work as expected
labels: ["needs-triage"]
body:
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.5"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: PathDeck commit
      description: Output of `git rev-parse --short HEAD` in the checkout you built from.
      placeholder: "c335f24"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace at ~/Projects
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include screenshots or crash logs if relevant.
    validations:
      required: true

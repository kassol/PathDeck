name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Fetch vendored GhosttyKit
        run: ./scripts/fetch-ghostty.sh

      - name: Build
        run: |
          xcodebuild -project PathDeck.xcodeproj -scheme PathDeck \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Unit tests
        # The macos-26 image currently runs macOS 26.4 while the product's
        # deployment target is 26.5 — tests can't launch on a lower host OS.
        # Override the target for the test run only; drop this once the image
        # reaches 26.5.
        run: |
          xcodebuild -project PathDeck.xcodeproj -scheme PathDeck \
            -only-testing:PathDeckTests \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MACOSX_DEPLOYMENT_TARGET=26.4 \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Dump crash reports
        if: failure()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          for f in ~/Library/Logs/DiagnosticReports/PathDeck*; do
            echo "===== $f ====="
            head -100 "$f"
          done || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"23b3acd2-26c8-4b66-b26c-82d6b3402a6e\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  html,body{margin:0;padding:0;height:100%;}\n  *{box-sizing:border-box;}\n  ::selection{background:rgba(94,158,255,0.35);}\n  @keyframes pd-blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}\n  @keyframes pd-fade{from{opacity:0;}to{opacity:1;}}\n  @keyframes pd-pop{from{opacity:0;transform:translateY(8px) scale(0.985);}to{opacity:1;transform:none;}}\n  .pd-scroll::-webkit-scrollbar{width:11px;height:11px;}\n  .pd-scroll::-webkit-scrollbar-thumb{background:var(--scroll,rgba(140,140,140,0.4));border-radius:6px;border:3px solid transparent;background-clip:content-box;}\n  .pd-scroll::-webkit-scrollbar-track{background:transparent;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div ref=\"{{ setRoot }}\" style=\"position:fixed;inset:0;font-family:-apple-system,'SF Pro Text','SF Pro Display',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg-desktop,#26262e);display:flex;align-items:center;justify-content:center;overflow:hidden;\">\n\n  <div ref=\"{{ setWin }}\" data-screen-label=\"PathDeck Window\" style=\"position:relative;width:1180px;height:752px;transform-origin:center center;border-radius:11px;background:var(--bg-window,#1e1e1e);box-shadow:var(--shadow,0 22px 70px rgba(0,0,0,0.55)),0 0 0 0.5px rgba(0,0,0,0.4);overflow:hidden;display:flex;flex-direction:column;\">\n\n    <!-- ===================== TOOLBAR ===================== -->\n    <div style=\"height:52px;flex:0 0 52px;display:flex;align-items:center;gap:9px;padding:0 12px 0 18px;background:var(--bg-toolbar,#2c2c2e);border-bottom:0.5px solid var(--separator,rgba(255,255,255,0.09));\">\n      <div style=\"display:flex;gap:8px;align-items:center;margin-right:8px;\">\n        <span style=\"width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.18);\"><\u002Fspan>\n        <span style=\"width:12px;height:12px;border-radius:50%;background:#febc2e;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.18);\"><\u002Fspan>\n        <span style=\"width:12px;height:12px;border-radius:50%;background:#28c840;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.18);\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isWorkspace }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:center;gap:9px;flex:1;min-width:0;\">\n          <button onclick=\"{{ toggleSidebar }}\" title=\"Toggle Sidebar\" style=\"display:flex;align-items:center;justify-content:center;width:30px;height:26px;border:none;background:transparent;color:var(--text-secondary,#999);border-radius:6px;cursor:pointer;\" style-hover=\"background:var(--row-hover,rgba(255,255,255,0.06))\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"3\" y=\"4.5\" width=\"18\" height=\"15\" rx=\"2.5\"><\u002Frect><line x1=\"9\" y1=\"4.5\" x2=\"9\" y2=\"19.5\"><\u002Fline><\u002Fsvg>\n          <\u002Fbutton>\n          <div style=\"display:flex;align-items:center;gap:2px;\">\n            <button title=\"Back\" style=\"display:flex;align-items:center;justify-content:center;width:28px;height:26px;border:none;background:transparent;color:var(--text-primary,#fff);border-radius:6px;cursor:pointer;\" style-hover=\"background:var(--row-hover,rgba(255,255,255,0.06))\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 5 8 12 15 19\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fbutton>\n            <button title=\"Forward\" style=\"display:flex;align-items:center;justify-content:center;width:28px;height:26px;border:none;background:transparent;color:var(--text-tertiary,#666);border-radius:6px;cursor:default;\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 5 16 12 9 19\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <!-- breadcrumb -->\n          <div style=\"display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-secondary,#999);padding:0 4px;overflow:hidden;\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"var(--folder,#4f93f7)\" stroke=\"none\"><path d=\"M3 6.5C3 5.4 3.9 4.5 5 4.5h4.2c.5 0 1 .2 1.4.6l1 1c.3.3.8.5 1.3.5H19c1.1 0 2 .9 2 2v8.4c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V6.5Z\"><\u002Fpath><\u002Fsvg>\n            <span style=\"cursor:pointer;\">Projects<\u002Fspan>\n            <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"opacity:0.45;\"><polyline points=\"9 5 16 12 9 19\"><\u002Fpolyline><\u002Fsvg>\n            <span style=\"color:var(--text-primary,#fff);font-weight:590;\">atlas<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:0 0 auto;display:flex;align-items:center;gap:8px;\">\n          <!-- search -->\n          <div style=\"display:flex;align-items:center;gap:6px;width:172px;height:28px;padding:0 9px;background:var(--bg-input,rgba(255,255,255,0.06));border:0.5px solid var(--control-border,rgba(255,255,255,0.14));border-radius:7px;color:var(--text-tertiary,#777);\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"16.5\" y1=\"16.5\" x2=\"21\" y2=\"21\"><\u002Fline><\u002Fsvg>\n            <span style=\"font-size:12.5px;\">Search atlas<\u002Fspan>\n          <\u002Fdiv>\n          <!-- vi yle=\"{{ termBtnStyle }}\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"5 8 9 12 5 16\"><\u002Fpolyline><line x1=\"12\" y1=\"16\" x2=\"18\" y2=\"16\"><\u002Fline><\u002Fsvg>\n            <span style=\"font-size:12.5px;font-weight:510;\">Terminal<\u002Fspan>\n          <\u002Fbutton>\n          <!-- changes -->\n          <button onclick=\"{{ showChanges }}\" title=\"Recent Changes\" style=\"{{ changesBtnStyle }}\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><polyline points=\"12 7.5 12 12 15.5 13.6\"><\u002Fpolyline><\u002Fsvg>\n            <span style=\"font-size:12.5px;font-weight:510;\">Changes<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--modified,#ff9f0a);color:#1a1206;font-size:10.5px;font-weight:700;\">6<\u002Fspan>\n          <\u002Fbutton>\n          <button onclick=\"{{ openSettings }}\" title=\"Settings\" style=\"display:flex;align-items:center;justify-content:center;width:30px;height:28px;border:none;background:transparent;color:var(--text-secondary,#999);border-radius:7px;cursor:pointer;\" style-hover=\"background:var(--row-hover,rgba(255,255,255,0.06))\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><line x1=\"4\" y1=\"8\" x2=\"20\" y2=\"8\"><\u002Fline><line x1=\"4\" y1=\"16\" x2=\"20\" y2=\"16\"><\u002Fline><circle cx=\"15\" cy=\"8\" r=\"2.4\" fill=\"var(--bg-toolbar,#2c2c2e)\"><\u002Fcircle><circle cx=\"9\" cy=\"16\" r=\"2.4\" fill=\"var(--bg-toolbar,#2c2c2e)\"><\u002Fcircle><\u002Fsvg tify-content:space-between;\">\n                    <span style=\"font-size:15px;font-weight:680;color:var(--text-primary,#fff);\">Recent Changes<\u002Fspan>\n                    <button onclick=\"{{ showPreview }}\" title=\"Close\" style=\"display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:var(--control-bg,rgba(255,255,255,0.08));color:var(--text-secondary,#999);border-radius:6px;cursor:pointer;\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:6px;margin-top:11px;\">\n                    <sc-for list=\"{{ changeFilters }}\" as=\"cf\" hint-placeholder-count=\"4\">\n                      <button onclick=\"{{ cf.onClick }}\" style=\"{{ cf.style }}\">{{ cf.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:6px 0 18px;\">\n                  <sc-for list=\"{{ changeGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n                    <div style=\"padding:13px 16px 5px;display:flex;align-items:center;gap:8px;\">\n                      <span style=\"font-size:11.5px;font-weight:680;color:var(--text-primary,#fff);\">{{ g.when }}<\u002Fspan>\n                      <sc-if value=\"{{ g.tag }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:8px;background:var(--tint-modified,rgba(255,159,10,0.14));color:var(--modified,#ff9f0a);font-size:10px;font-weight:600;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--modified,#ff9f0a);\"><\u002Fspan>{{ g.tag }}<\u002Fspan>\n                      <\u002Fsc-if>\n                      <span style=\"flex:1;\"><\u002Fspan>\n                      <span style=\"font-size:11px;color:var(--text-tertiary,#777);\">{{ g.summary }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ g.shownItems }}\" as=\"ci\" hint-placeholder-count=\"3\">\n                      <div onclick=\"{{ ci.onClick }}\" style=\"display:flex;align-items:center;gap:10px;margin:1px 8px;padding:7px 10px;border-radius:7px;cursor:pointer;\" style-hover=\"background:var(--row-hover,rgba(255,255,255,0.06))\">\n                        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:5px;flex:0 0 19px;background:{{ ci.tint }};color:{{ ci.color }};font-size:12px;font-weight:800;font-family:ui-monospace,Menlo,monospace;\">{{ ci.symbol }}<\u002Fspan>\n                        <div style=\"flex:1;min-width:0;\">\n                          <div style=\"font-size:12.5px;color:var(--text-primary,#fff);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ ci.name }}<\u002Fdiv>\n                          <div style=\"font-size:11px;color:var(--text-tertiary,#777);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ ci.path }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <span style=\"font-size:10.5px;color:var(--text-tertiary,#777);\">{{ ci.time }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n            <\u002Faside>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n\n        <!-- BOTTOM TERMINAL (layouts A & C) -->\n        <sc-if value=\"{{ showBottomTerminal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"height:236px;flex:0 0 236px;display:flex;flex-direction:column;background:var(--bg-term,#161618);border-top:0.5px solid var(--separator-strong,rgba(255,255,255,0.16));\">\n " viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7fb0ff\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"5 8 9 12 5 16\"><\u002Fpolyline><line x1=\"12\" y1=\"16\" x2=\"18\" y2=\"16\"><\u002Fline><\u002Fsvg>\n            <span style=\"font-size:12.5px;font-weight:560;\">New Folder with Terminal<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:680;color:var(--text-primary,#fff);margin:24px 0 10px;\">Recent<\u002Fdiv>\n        <div class=\"pd-scroll\" style=\"flex:1;overflow-y:auto;\">\n          <sc-for list=\"{{ recentFolders }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div onclick=\"{{ enterWorkspace }}\" style=\"display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;cursor:pointer;\" style-hover=\"background:var(--row-hover,rgba(255,255,255,0.06))\">\n              <span style=\"display:inline-flex;color:var(--folder,#4f93f7);\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" stroke=\"none\"><path d=\"M3 6.5C3 5.4 3.9 4.5 5 4.5h4.2c.5 0 1 .2 1.4.6l1 1c.3.3.8.5 1.3.5H19c1.1 0 2 .9 2 2v8.4c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V6.5Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div style=\"flex:1;min-width:0;\">\n                <div style=\"font-size:13px;font-weight:560;color:var(--text-primary,#fff);\">{{ r.name }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--text-tertiary,#777);\">{{ r.path }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:11px;color:var(--text-tertiary,#777);\">{{ r.when }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <label style=\"display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12px;color:var(--text-secondary,#999);cursor:pointer;\">\n          <span style=\"width:14px;height:14px;border-radius:4px;background:var(--accent,#5e9eff);display:inline-flex;align-items:center;justify-content:center;\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"5 12 10 17 19 7\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>\n          Show this window when PathDeck launches\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== COMMAND PALETTE ===================== -->\n    <sc-if value=\"{{ overlayPalette }}\" hint-placeholder-val=\"{{ false }}\">\n      <div onclick=\"{{ closeOverlay }}\" style=\"position:absolute;inset:0;z-index:30;background:rgba(0,0,0,0.28);display:flex;align-items:flex-start;justify-content:center;padding-top:96px;\">\n        <div onclick=\"{{ stop }}\" style=\"width:580px;background:var(--bg-elevated,#323236);border:0.5px solid var(--separator-strong,rgba(255,255,255,0.16));border-radius:13px;box-shadow:var(--menu-shadow,0 12px 40px rgba(0,0,0,0.5));overflow:hidden;\">\n          <div style=\"display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:0.5px solid var(--separator,rgba(255,255,255,0.09));\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--text-tertiary,#888)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"5 8 9 12 5 16\"><\u002Fpolyline><line x1=\"12\" y1=\"16\" x2=\"18\" y2=\"16\"><\u002Fline><\u002Fsvg>\n            <span style=\"font-size:16px;color:var(--text-tertiary,#888);\">Run a command in atlas…<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"max-height:340px;overflow-y:auto;padding:7px;\" class=\"pd-scroll\">\n            <sc-for list=\"{{ paletteCmds }}\" as=\"cmd\" hint-placeholder-count=\"6\">\n              <div onclick=\"{{ cmd.onClick }}\" style=\"{{ cmd.style }}\" style-hover=\"background:var(--accent,#5e9eff)\">\n                <span style=\"display:inline-flex;width:18px;color:var(--text-secondary,#aaa);\">{{ cmd.iconChar }}<\u002Fspan>\n                <span style=\"flex:1;font-size:13.5px;color:var(--text-primary,#fff);\">{{ cmd.title }}<\u002Fspan>\n                <span style=\"font-size:11.5px;color:var(--text-tertiary,#888);\">{{ cmd.sub }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-tertiary,#888);padding:2px 6px;border-radius:5px;background:var(--control-bg,rgba(255,255,255,0.08));\">{{ cmd.keys }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== DIFF / RESTORE ===================== -->\n    <sc-if value=\"{{ overlayDiff }}\" hint-placeholder-val=\"{{ false }}\">\n      <div onclick=\"{{ closeOverlay }}\" style=\"position:absolute;inset:0;z-index:30;background:rgba(0,0,0,0.34);display:flex;align-items:center;justify-content:center;\">\n        <div onclick=\"{{ stop }}\" data-screen-label=\"Diff\" style=\"width:780px;height:540px;display:flex;flex-direction:column;background:var(--bg-window,#1e1e1e);border:0.5px solid var(--separator-strong,rgba(255,255,255,0.16));border-radius:12px;box-shadow:var(--menu-shadow,0 12px 40px rgba(0,0,0,0.5));overflow:hidden;\">\n          <div style=\"display:flex;align-items:center;gap:12px;height:50px;flex:0 0 50px;padding:0 14px;background:var(--bg-toolbar,#2c2c2e);border-bottom:0.5px solid var(--separator,rgba(255,255,255,0.09));\">\n            <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:700;color:#fff;padding:3px 7px;border-radius:5px;background:rgba(47,111,237,0.16);color:#5e9eff;\">MD<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;\">\n              <span style=\"font-size:13px;font-weight:640;color:var(--text-primary,#fff);\">summary.md<\u002Fspan>\n              <span style=\"font-size:11px;color:var(--text-secondary,#999);\">Compare with previous version · ~/Projects/atlas<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1;\"><\u002Fdiv>\n            <div style=\"display:flex;gap:2px;padding:2px;background:var(--bg-input,rgba(255,255,255,0.06));border-radius:7px;\">\n              <button onclick=\"{{ setDiffInline }}\" style=\"{{ diffInlineBtn }}\">Inline<\u002Fbutton>\n              <button onclick=\"{{ setDiffSplit }}\" style=\"{{ diffSplitBtn }}\">Side by Side<\u002Fbutton>\n            <\u002Fdiv>\n            <button onclick=\"{{ closeOverlay }}\" style=\"display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:var(--control-bg,rgba(255,255,255,0.08));color:var(--text-secondary,#999);border-radius:7px;cursor:pointer;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- inline diff -->\n          <sc-if value=\"{{ diffIsInline }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"pd-scroll\" style=\"flex:1;overflow-y:auto;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;line-height:1.7;background:var(--bg-term,#161618);\">\n            <sc-for list=\"{{ diffLines }}\" as=\"dl\" hint-placeholder-count=\"10\">\n              <div style=\"{{ dl.style }}\">\n                <span style=\"display:inline-block;width:34px;text-align:right;padding-right:10px;color:#666;user-select:none;\">{{ dl.ln }}<\u002Fspan>\n                <span style=\"display:inline-block;width:16px;color:{{ dl.signColor }};\">{{ dl.sign }}<\u002Fspan>\n                <span style=\"white-space:pre;color:{{ dl.textColor }};\">{{ dl.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- side by side -->\n          <sc-if value=\"{{ diffIsSplit }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1;display:flex;min-height:0;background:var(--bg-term,#161618);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;line-height:1.7;\">\n            <div class=\"pd-scroll\" style=\"flex:1;overflow-y:auto;border-right:0.5px solid rgba(255,255,255,0.1);\">\n              <div style=\"position:sticky;top:0;padding:6px 14px;background:rgba(255,69,58,0.12);color:#ff9a92;font-size:11px;font-weight:600;font-family:-apple-system,sans-serif;\">Previous version<\u002Fdiv>\n              <sc-for list=\"{{ diffBefore }}\" as=\"dl\" hint-placeholder-count=\"8\"><div style=\"{{ dl.style }}\"><span style=\"display:inline-block;width:30px;text-align:right;padding-right:10px;color:#666;\">{{ dl.ln }}<\u002Fspan><span style=\"white-space:pre;color:{{ dl.textColor }};\">{{ dl.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"pd-scroll\" style=\"flex:1;overflow-y:auto;\">\n              <div style=\"position:sticky;top:0;padding:6px 14px;background:rgba(48,209,88,0.12);color:#7ee49a;font-size:11px;font-weight:600;font-family:-apple-system,sans-serif;\">Current<\u002Fdiv>\n              <sc-for list=\"{{ diffAfter }}\" as=\"dl\" hint-placeholder-count=\"8\"><div style=\"{{ dl.style }}\"><span style=\"display:inline-block;width:30px;text-align:right;padding-right:10px;color:#666;\">{{ dl.ln }}<\u002Fspan><span style=\"white-space:pre;color:{{ dl.textColor }};\">{{ dl.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;align-items:center;gap:12px;height:56px;flex:0 0 56px;padding:0 16px;background:var(--bg-toolbar,#2c2c2e);border-top:0.5px solid var(--separator,rgba(255,255,255,0.09));\">\n            <span style=\"font-size:11.5px;color:var(--text-tertiary,#777);\">Restoring creates a new entry in Recent Changes — this stays undoable.<\u002Fspan>\n            <div style=\"flex:1;\"><\u002Fdiv>\n            <button onclick=\"{{ closeOverlay }}\" style=\"height:30px;padding:0 14px;border:0.5px solid var(--control-border,rgba(255,255,255,0.14));background:var(--control-bg,rgba(255,255,255,0.08));color:var(--text-primary,#fff);border-radius:7px;font-size:12.5px;font-weight:540;cursor:pointer;\">Cancel<\u002Fbutton>\n            <button onclick=\"{{ closeOverlay }}\" style=\"display:flex;align-items:center;gap:6px;height:30px;padding:0 14px;border:none;background:var(--accent,#5e9eff);color:#fff;border-radius:7px;font-size:12.5px;font-weight:590;cursor:pointer;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"3 8 3 13 8 13\"><\u002Fpolyline><path d=\"M3.5 13a8 8 0 1 0 2-8.4L3 8\"><\u002Fpath><\u002Fsvg>Restore Previous Version<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== SETTINGS ===================== -->\n    <sc-if value=\"{{ overlaySettings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div onclick=\"{{ closeOverlay }}\" style=\"position:absolute;inset:0;z-index:30;background:rgba(0,0,0,0.34);display:flex;align-items:center;justify-content:center;\">\n        <div onclick=\"{{ stop }}\" data-screen-label=\"Settings\" style=\"width:600px;height:470px;display:flex;flex-direction:column;background:var(--bg-window,#1e1e1e);border:0.5px solid var(--separator-strong,rgba(255,255,255,0.16));border-radius:12px;box-shadow:var(--menu-shadow,0 12px 40px rgba(0,0,0,0.5));overflow:hidden;\">\n          <div style=\"display:flex;align-items:center;gap:6px;height:74px;flex:0 0 74px;padding:0 16px;background:var(--bg-toolbar,#2c2c2e);border-bottom:0.5px solid var(--separator,rgba(255,255,255,0.09));\">\n            <div style=\"position:absolute;left:14px;top:12px;display:flex;gap:7px;\">\n              <span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f57;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#febc2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#28c840;\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1;display:flex;justify-content:center;gap:4px;margin-top:14px;\">\n              <sc-for list=\"{{ settingsTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\"><span style=\"font-size:18px;\">{{ t.icon }}<\u002Fspan><span style=\"font-size:10.5px;\">{{ t.label }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pd-scroll\" style=\"flex:1;overflow-y:auto;padding:24px 30px;\">\n            <sc-for list=\"{{ settingsRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;align-items:center;gap:16px;padding:9px 0;\">\n                <span style=\"width:150px;text-align:right;font-size:12.5px;color:var(--text-secondary,#999);flex:0 0 150px;\">{{ row.label }}<\u002Fspan>\n                <div style=\"flex:1;\">{{ row.control }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- ===================== HARNESS ===================== -->\n  <div style=\"position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:5px;padding:6px 8px;background:rgba(28,28,32,0.82);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:0.5px solid rgba(255,255,255,0.13);border-radius:13px;box-shadow:0 12px 34px rgba(0,0,0,0.42);font-family:-apple-system,system-ui,sans-serif;\">\n    <button onclick=\"{{ goWelcome }}\" style=\"{{ hWelcome }}\">Welcome<\u002Fbutton>\n    <button onclick=\"{{ goWorkspace }}\" style=\"{{ hWorkspace }}\">Workspace<\u002Fbutton>\n    <span style=\"width:1px;height:18px;background:rgba(255,255,255,0.14);margin:0 3px;\"><\u002Fspan>\n    <span style=\"font-size:10.5px;color:#888;font-weight:600;padding:0 2px;\">Layout<\u002Fspan>\n    <button onclick=\"{{ setLayoutA }}\" style=\"{{ hLayoutA }}\" title=\"Terminal docked bottom\">A<\u002Fbutton>\n    <button onclick=\"{{ setLayoutB }}\" style=\"{{ hLayoutB }}\" title=\"Terminal docked right\">B<\u002Fbutton>\n    <button onclick=\"{{ setLayoutC }}\" style=\"{{ hLayoutC }}\" title=\"Changes co-star\">C<\u002Fbutton>\n    <span style=\"width:1px;height:18px;background:rgba(255,255,255,0.14);margin:0 3px;\"><\u002Fspan>\n    <button onclick=\"{{ toggleTerminal }}\" style=\"{{ hTerminal }}\">Terminal<\u002Fbutton>\n    <button onclick=\"{{ openPalette }}\" style=\"{{ hPalette }}\">⌘K<\u002Fbutton>\n    <button onclick=\"{{ openSettings }}\" style=\"{{ hSettings }}\">Settings<\u002Fbutton>\n    <span style=\"width:1px;height:18px;background:rgba(255,255,255,0.14);margin:0 3px;\"><\u002Fspan>\n    <button onclick=\"{{ toggleTheme }}\" style=\"display:flex;align-items:center;gap:5px;height:26px;padding:0 11px;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:#fff;font-size:12px;font-weight:560;cursor:pointer;\">{{ themeLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'workspace',\n    theme: 'dark',\n    layout: 'A',\n    view: 'list',\n    sidebarOpen: true,\n    terminalOpen: false,\n    rightMode: 'preview',\n    overlay: null,\n    selectedId: 'f-summary',\n    changeFilter: 'all',\n    diffMode: 'inline',\n    settingsTab: 'terminal',\n  };\n\n  themes = {\n    dark: {\n      'bg-desktop':'radial-gradient(120% 120% at 50% 0%,#3a3a46,#262630 55%,#1c1c24)',\n      'bg-window':'#1e1e1e','bg-sidebar':'#2a2a2c','bg-toolbar':'#2c2c2e','bg-panel':'#252527',\n      'bg-elevated':'#34343a','bg-input':'rgba(255,255,255,0.07)','bg-term':'#161618',\n      'text-primary':'rgba(255,255,255,0.92)','text-secondary':'rgba(255,255,255,0.56)','text-tertiary':'rgba(255,255,255,0.36)',\n      'separator':'rgba(255,255,255,0.09)','separator-strong':'rgba(255,255,255,0.16)','row-hover':'rgba(255,255,255,0.06)',\n      'accent':'#5e9eff','control-bg':'rgba(255,255,255,0.08)','control-border':'rgba(255,255,255,0.14)',\n      'tint-added':'rgba(48,209,88,0.13)','tint-modified':'rgba(255,159,10,0.13)',\n      'added':'#30d158','modified':'#ff9f0a','deleted':'#ff453a','renamed':'#bf5af2','folder':'#5b9bf5',\n      'ph':'rgba(150,150,160,0.16)','scroll':'rgba(180,180,190,0.32)',\n      'shadow':'0 26px 80px rgba(0,0,0,0.6)','menu-shadow':'0 16px 50px rgba(0,0,0,0.55)',\n    },\n    light: {\n      'bg-desktop':'radial-gradient(120% 120% at 50% 0%,#d7dfee,#b3bfd6 55%,#94a2bd)',\n      'bg-window':'#ffffff','bg-sidebar':'#e8e8eb','bg-toolbar':'#f1f1f3','bg-panel':'#f6f6f8',\n      'bg-elevated':'#ffffff','bg-input':'#ffffff','bg-term':'#161618',\n      'text-primary':'rgba(0,0,0,0.85)','text-secondary':'rgba(0,0,0,0.5)','text-tertiary':'rgba(0,0,0,0.34)',\n      'separator':'rgba(0,0,0,0.09)','separator-strong':'rgba(0,0,0,0.13)','row-hover':'rgba(0,0,0,0.045)',\n      'accent':'#0a6cff','control-bg':'#ffffff','control-border':'rgba(0,0,0,0.14)',\n      'tint-added':'rgba(40,167,69,0.12)','tint-modified':'rgba(217,138,0,0.13)',\n      'added':'#1f9d3f','modified':'#cf8500','deleted':'#e0382b','renamed':'#a23bd6','folder':'#3b82f6',\n      'ph':'rgba(0,0,0,0.07)','scroll':'rgba(0,0,0,0.26)',\n      'shadow':'0 26px 80px rgba(0,0,0,0.3)','menu-shadow':'0 16px 50px rgba(0,0,0,0.26)',\n    },\n  };\n\n  extColors = { md:'#2f6fed', pdf:'#e0382b', png:'#a23bd6', csv:'#1f9d3f', py:'#d98a00', yaml:'#14b8a6', zip:'#8a8a8e', txt:'#64748b' };\n\n  rawFiles = [\n    { id:'d-assets', name:'assets', isFolder:true, date:'Today, 9:14 AM', size:'—', kind:'Folder' },\n    { id:'d-src', name:'src', isFolder:true, date:'Yesterday, 6:02 PM', size:'—', kind:'Folder' },\n    { id:'f-summary', name:'summary.md', ext:'md', date:'Just now', size:'6 KB', kind:'Markdown', changed:'modified' },\n    { id:'f-report', name:'report.pdf', ext:'pdf', date:'Just now', size:'820 KB', kind:'PDF Document', changed:'added' },\n    { id:'f-chart', name:'chart-01.png', ext:'png', date:'Just now', size:'112 KB', kind:'PNG Image', changed:'added' },\n    { id:'f-data', name:'data.csv', ext:'csv', date:'Just now', size:'48 KB', kind:'CSV Document', changed:'modified' },\n    { id:'f-build', name:'build_report.py', ext:'py', date:'2:14 PM', size:'2 KB', kind:'Python Script' },\n    { id:'f-readme', name:'README.md', ext:'md', date:'Today, 10:41 AM', size:'4 KB', kind:'Markdown' },\n    { id:'f-config', name:'config.yaml', ext:'yaml', date:'Jun 11', size:'1 KB', kind:'YAML' },\n    { id:'f-archive', name:'archive.zip', ext:'zip', date:'Jun 10', size:'14 MB', kind:'Archive' },\n    { id:'f-notes', name:'notes.md', ext:'md', date:'1:50 PM', size:'9 KB', kind:'Markdown' },\n  ];\n\n  componentDidMount() { this.apply(this.state.theme); this._onResize = () => this.fit(); window.addEventListener('resize', this._onResize); this.fit(); }\n  componentWillUnmount() { if (this._onResize) window.removeEventListener('resize', this._onResize); }\n  setRoot = (el) => { this.rootEl = el; if (el) this.apply(this.state.theme); };\n  setWin = (el) => { this.winEl = el; this.fit(); };\n  fit = () => { const el = this.winEl; if (!el) return; const vw = window.innerWidth, vh = window.innerHeight; const s = Math.min(1, (vw - 36) / 1180, (vh - 84) / 752); el.style.transform = 'scale(' + s + ')'; };\n  apply(mode) { const el = this.rootEl; if (!el) return; const t = this.themes[mode]; for (const k in t) el.style.setProperty('--' + k, t[k]); }\n\n  set = (patch) => this.setState(patch);\n  stop = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };\n\n  changeMeta(type) {\n    const m = {\n      added:    { color:'var(--added,#30d158)',   tint:'var(--tint-added,rgba(48,209,88,0.13))',  symbol:'+', label:'Added' },\n      modified: { color:'var(--modified,#ff9f0a)', tint:'var(--tint-modified,rgba(255,159,10,0.13))', symbol:'~', label:'Modified' },\n      deleted:  { color:'var(--deleted,#ff453a)',  tint:'rgba(255,69,58,0.14)', symbol:'\\u2212', label:'Deleted' },\n      renamed:  { color:'var(--renamed,#bf5af2)',  tint:'rgba(191,90,242,0.14)', symbol:'\\u2192', label:'Renamed' },\n    };\n    return m[type] || m.modified;\n  }\n\n  hbtn(active) {\n    return 'height:26px;padding:0 11px;border:none;border-radius:8px;font-size:12px;font-weight:540;cursor:pointer;'\n      + (active ? 'background:var(--accent,#5e9eff);color:#fff;' : 'background:transparent;color:#cfcfd4;');\n  }\n  hseg(active) {\n    return 'width:26px;height:26px;border:none;border-radius:7px;font-size:12px;font-weight:680;cursor:pointer;'\n      + (active ? 'background:var(--accent,#5e9eff);color:#fff;' : 'background:rgba(255,255,255,0.07);color:#cfcfd4;');\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isWorkspace = s.screen === 'workspace';\n    const isWelcome = s.screen === 'welcome';\n    const dock = s.layout === 'B' ? 'right' : 'bottom';\n    const forceChanges = s.layout === 'C';\n    const rightMode = forceChanges ? 'changes' : s.rightMode;\n    const showRightTerminal = isWorkspace && s.terminalOpen && dock === 'right';\n    const showRightPanel = isWorkspace && !showRightTerminal;\n    const showBottomTerminal = isWorkspace && s.terminalOpen && dock === 'bottom';\n    const rightW = forceChanges ? 344 : 312;\n\n    // files\n    const files = this.rawFiles.map(f => {\n      const sel = f.id === s.selectedId;\n      const ext = f.ext || '';\n      const ec = this.extColors[ext] || '#64748b';\n      let bg = 'transparent';\n      if (f.changed === 'added') bg = 'var(--tint-added,rgba(48,209,88,

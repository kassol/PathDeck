document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e19dffcc-8f40-42f6-912f-22fca546f75d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  html,body{margin:0;padding:0;}\n  *{box-sizing:border-box;}\n  body{background:#ececed;}\n  ::selection{background:rgba(10,108,255,0.22);}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#ececed;font-family:-apple-system,'SF Pro Text','SF Pro Display',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1a1a1c;padding:48px 40px 80px;\">\n  <div style=\"max-width:1080px;margin:0 auto;\">\n\n    <!-- HEADER -->\n    <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:14px;\">\n      <div style=\"width:72px;height:72px;border-radius:17px;background:linear-gradient(160deg,#5e9eff,#3b6fd4);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(59,111,212,0.34);flex:0 0 72px;\">\n        <svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"5 8 9 12 5 16\"><\u002Fpolyline><line x1=\"12\" y1=\"16\" x2=\"18\" y2=\"16\"><\u002Fline><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"flex:1;\">\n        <div style=\"font-size:30px;font-weight:700;letter-spacing:-0.02em;\">PathDeck — Design System<\u002Fdiv>\n        <div style=\"font-size:15px;color:#5a5a5e;margin-top:3px;\">A Finder-first command workspace for macOS. Native materials, SF Pro, system controls.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px;align-items:flex-end;font-size:11.5px;color:#86868b;\">\n        <span style=\"padding:3px 9px;border-radius:7px;background:#fff;border:0.5px solid rgba(0,0,0,0.1);\">macOS 26 · AppKit + SwiftUI<\u002Fspan>\n        <span style=\"padding:3px 9px;border-radius:7px;background:#fff;border:0.5px solid rgba(0,0,0,0.1);\">v1.0 · M1<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- =============== FOUNDATIONS =============== -->\n    <div style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;color:#86868b;text-transform:uppercase;margin:38px 0 14px;\">Foundations<\u002Fdiv>\n\n    <!-- COLOR -->\n    <div style=\"background:#fbfbfc;border:0.5px solid rgba(0,0,0,0.1);border-radius:16px;padding:26px 28px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,0.04);\">\n      <div style=\"font-size:17px;font-weight:680;margin-bottom:4px;\">Color<\u002Fdiv>\n      <div style=\"font-size:13px;color:#6a6a6e;margin-bottom:22px;\">System-derived surfaces with vibrancy. Full light + dark. Selection blue is the single brand accent; amber carries the differentiating <em>Recent Changes<\u002Fem> signal.<\u002Fdiv>\n\n      <sc-for list=\"{{ colorGroups }}\" as=\"grp\" hint-placeholder-count=\"2\">\n        <div style=\"margin-bottom:20px;\">\n          <div style=\"display:flex;align-items:center;gap:8px;font-size:12px;font-weight:640;color:#3a3a3e;margin-bottom:11px;\">\n            <span style=\"width:9px;height:9px;border-radius:3px;background:{{ grp.dot }};\"><\u002Fspan>{{ grp.title }}\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:14px;\">\n            <sc-for list=\"{{ grp.swatches }}\" as=\"sw\" hint-placeholder-count=\"6\">\n              <div style=\"width:120px;\">\n                <div style=\"height:56px;border-radius:9px;background:{{ sw.hex }};border:0.5px solid rgba(0,0,0,0.14);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.06);\"><\u002Fdiv>\n                <div style=\"font-size:11.5px;font-weight:560;margin-top:7px;\">{{ sw.name }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:#86868b;font-family:ui-monospace,'SF Mono',Menlo,monospace;\">{{ sw.hex }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n b60;\">2 warnings<\u002Fspan> suppressed<\u002Fdiv>\n            <div><span style=\"color:#7fb0ff;\">➜ <\u002Fspan><span style=\"color:#7ee49a;\">atlas <\u002Fspan><span style=\"display:inline-block;width:8px;height:15px;background:#d6d6d6;vertical-align:-3px;\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:300px;\">\n          <div style=\"font-size:11px;font-weight:600;color:#86868b;margin-bottom:10px;\">ANSI palette<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:9px;\">\n            <sc-for list=\"{{ ansi }}\" as=\"a\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;width:62px;\">\n                <div style=\"width:100%;height:30px;border-radius:6px;background:{{ a.hex }};border:0.5px solid rgba(255,255,255,0.1);\"><\u002Fdiv>\n                <span style=\"font-size:10px;color:#9a9a9f;\">{{ a.name }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- VOICE -->\n    <div style=\"display:flex;gap:18px;margin-bottom:8px;align-items:stretch;\">\n      <div style=\"flex:1;background:#fbfbfc;border:0.5px solid rgba(0,0,0,0.1);border-radius:16px;padding:24px 26px;box-shadow:0 1px 2px rgba(0,0,0,0.04);\">\n        <div style=\"display:flex;align-items:center;gap:8px;font-size:15px;font-weight:680;color:#1f9d3f;margin-bottom:14px;\"><span style=\"width:18px;height:18px;border-radius:5px;background:rgba(40,167,69,0.16);display:inline-flex;align-items:center;justify-content:center;color:#1f9d3f;font-weight:800;\">✓<\u002Fspan>Voice — use<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:#3a3a3e;font-family:ui-monospace,'SF Mono',Menlo,monospace;\">\n          <span>Open Terminal Here<\u002Fspan><span>Send Path to Terminal<\u002Fspan><span>Recent Changes · Changed Just Now<\u002Fspan><span>Compare with Previous Version<\u002Fspan><span>Restore Previous Version<\u002Fspan><span>Terminal Active Changes<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#fbfbfc;border:0.5px solid rgba(0,0,0,0.1);border-radius:16px;padding:24px 26px;box-shadow:0 1px 2px rgba(0,0,0,0.04);\">\n        <div style=\"display:flex;align-items:center;gap:8px;font-size:15px;font-weight:680;color:#e0382b;margin-bottom:14px;\"><span style=\"width:18px;height:18px;border-radius:5px;background:rgba(224,56,43,0.14);display:inline-flex;align-items:center;justify-content:center;color:#e0382b;font-weight:800;\">✕<\u002Fspan>Voice — avoid<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n          <sc-for list=\"{{ avoid }}\" as=\"w\" hint-placeholder-count=\"6\">\n            <span style=\"padding:3px 9px;border-radius:7px;background:#f0f0f2;color:#9a9a9f;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;text-decoration:line-through;\">{{ w }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:#86868b;margin-top:14px;line-height:1.5;\">PathDeck is Finder-first and agent-agnostic. Git, agents, and runtimes never surface in the UI vocabulary.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const tint = (hex, a) => {\n      const h = hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);\n      return 'rgba('+r+','+g+','+b+','+a+')';\n    };\n    const fileTypes = [\n      {ext:'md',hex:'#2f6fed'},{ext:'pdf',hex:'#e0382b'},{ext:'png',hex:'#a23bd6'},{ext:'csv',hex:'#1f9d3f'},\n      {ext:'py',hex:'#d98a00'},{ext:'yaml',hex:'#14b8a6'},{ext:'zip',hex:'#8a8a8e'},{ext:'txt',hex:'#64748b'},\n    ].map(f => ({ ...f, tint: tint(f.hex, 0.15) }));\n\n    const cm = { added:{c:'#1f9d3f',s:'+',l:'Added'}, modified:{c:'#cf8500',s:'~',l:'Modified'}, deleted:{c:'#e0382b',s:'\\u2212',l:'Deleted'}, renamed:{c:'#a23bd6',s:'\\u2192',l:'Renamed'} };\n    const changeSamples = [\n      {type:'added', name:'report.pdf', time:'10:42'},\n      {type:'modified', name:'summary.md', time:'10:42'},\n      {type:'deleted', name:'draft.txt', time:'10:36'},\n    ].map(i => ({ name:i.name, time:i.time, color:cm[i.type].c, symbol:cm[i.type].s, label:cm[i.type].l, tint:tint(cm[i.type].c,0.15) }));\n\n    return {\n      colorGroups: [\n        { title:'Dark surfaces', dot:'#2c2c2e', swatches:[\n          {name:'Window',hex:'#1e1e1e'},{name:'Sidebar',hex:'#2a2a2c'},{name:'Toolbar',hex:'#2c2c2e'},\n          {name:'Panel',hex:'#252527'},{name:'Elevated',hex:'#34343a'},{name:'Terminal',hex:'#161618'},\n        ]},\n        { title:'Light surfaces', dot:'#e8e8eb', swatches:[\n          {name:'Window',hex:'#ffffff'},{name:'Sidebar',hex:'#e8e8eb'},{name:'Toolbar',hex:'#f1f1f3'},\n          {name:'Panel',hex:'#f6f6f8'},{name:'Separator',hex:'#dcdcdf'},{name:'Hover',hex:'#ededf0'},\n        ]},\n        { title:'Accent', dot:'#5e9eff', swatches:[\n          {name:'Accent · dark',hex:'#5e9eff'},{name:'Accent · light',hex:'#0a6cff'},{name:'Folder',hex:'#3b82f6'},\n        ]},\n        { title:'Change semantics', dot:'#ff9f0a', swatches:[\n          {name:'Added',hex:'#30d158'},{name:'Modified',hex:'#ff9f0a'},{name:'Deleted',hex:'#ff453a'},{name:'Renamed',hex:'#bf5af2'},\n        ]},\n      ],\n      metrics: [\n        {k:'Window radius', v:'11 px'},\n        {k:'Toolbar height', v:'52 px'},\n        {k:'Sidebar width', v:'220 px'},\n        {k:'List row height', v:'30 px'},\n        {k:'Traffic lights', v:'12 px · 8 gap'},\n        {k:'Control height', v:'28 px'},\n        {k:'Right panel', v:'312 / 344 px'},\n        {k:'Terminal dock', v:'236 px · 480 px'},\n        {k:'Spacing scale', v:'4 6 8 10 14 18 22'},\n      ],\n      fileTypes, changeSamples,\n      ansi: [\n        {name:'fg',hex:'#d6d6d6'},{name:'red',hex:'#ff6b60'},{name:'green',hex:'#7ee49a'},{name:'yellow',hex:'#ffcf6b'},\n        {name:'blue',hex:'#7fb0ff'},{name:'magenta',hex:'#d79bf5'},{name:'cyan',hex:'#6bd6d6'},{name:'bg',hex:'#161618'},\n      ],\n      avoid: ['Agent Runtime','Agent Profile','Tool Calling','Git','branch','commit','worktree','checkout','sandbox','orchestration','AI Finder'],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
